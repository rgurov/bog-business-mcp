[project]
name = "bog-business-mcp"
version = "0.1.0"
description = "Read-only MCP server for Bank of Georgia Business Online API: accounts, balances and recent transactions"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "bank-of-georgia", "bog", "businessonline", "banking", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.urls]
Repository = "https://github.com/rgurov/bog-business-mcp"

[project.scripts]
bog-business-mcp = "bog_business_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bog_business_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real BoG API (requires BOG_LIVE=1 and credentials)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
venvPath = "."
venv = ".venv"
